[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "systemsense"
version = "0.1.0"
description = "Local-first, read-only Windows investigation core"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "SystemSense contributors" }]
dependencies = [
    "psutil>=7.0,<8",
    "pydantic>=2.12,<3",
    "pywin32>=311; sys_platform == 'win32'",
    "rich>=14.0,<15",
    "typer>=0.21,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
local-models = [
    "tokenizers>=0.22,<1",
]

[project.scripts]
systemsense = "systemsense.cli:main"
systemsense-mcp = "systemsense.cli:mcp_main"

[dependency-groups]
dev = [
    "build>=1.4,<2",
    "hypothesis>=6.151,<7",
    "pyright>=1.1.408,<2",
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/systemsense"]

[tool.pyright]
include = ["src", "tests", "benchmarks"]
exclude = [".venv"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["mcp: optional MCP adapter integration tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
